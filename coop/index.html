const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openIt(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.s),iterations:D.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.i)},k,b64(D.c)));
}
async function tryPw(pw,quiet){
  try{const h=await openIt(pw);try{sessionStorage.setItem("coopPw",pw)}catch(e){}document.open();document.write(h);document.close();}
  catch(e){if(!quiet)document.getElementById("err").style.display="block";}
}
document.getElementById("go").onclick=()=>tryPw(document.getElementById("pw").value);
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")tryPw(e.target.value)});
try{const s=sessionStorage.getItem("coopPw");if(s)tryPw(s,true)}catch(e){}
